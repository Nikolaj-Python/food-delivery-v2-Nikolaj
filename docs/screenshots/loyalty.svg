<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500">
  <rect width="900" height="500" fill="#fafafc"/>
  <rect width="900" height="70" fill="#9c27b0"/>
  <text x="30" y="45" font-family="Arial" font-size="28" fill="white" font-weight="bold">FoodDelivery — Программа лояльности</text>
  <text x="40" y="130" font-family="Arial" font-size="24" fill="#222" font-weight="bold">Текущий баланс бонусов: 192 ⭐</text>
  <text x="40" y="190" font-family="Arial" font-size="18" fill="#222">За каждый заказ начисляется 10% бонусов.</text>
  <text x="40" y="230" font-family="Arial" font-size="18" fill="#222">1 бонус = 1 ₽. Можно списать при следующем заказе.</text>
  <text x="40" y="290" font-family="Arial" font-size="18" fill="#222">Активные промокоды:</text>
  <text x="50" y="330" font-family="Arial" font-size="18" fill="#222">SAVE10  →  10% скидка</text>
  <text x="50" y="370" font-family="Arial" font-size="18" fill="#222">WELCOME →  15% скидка</text>
</svg>